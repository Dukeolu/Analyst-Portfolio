# /etc/sysctl.d/99-hardening.conf — new file added during remediation
# on erp-integration-01.meridianmfg.local. Loaded in addition to the
# distribution's base sysctl.conf, which is left otherwise unchanged.

# control 3.2 — disable ICMP redirect acceptance (prevents a class of
# man-in-the-middle routing attacks on the local network segment)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# control 3.3 — enable reverse path filtering (drops packets with a source
# address that couldn't have legitimately arrived via the receiving interface)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Belt-and-suspenders network hardening, consistent with the other controls above
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1
