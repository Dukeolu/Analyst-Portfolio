# Meridian Manufacturing — Riverside Branch — Firewall Rules (simulated)
# pfSense-style rule table (evaluated top-to-bottom, first match wins).
# Default policy: DENY. Every inter-VLAN path that's allowed is an explicit,
# narrowly-scoped exception below it — nothing is allowed "because it's easier."

# ============================================================================
# INTERFACE: GUEST (VLAN 40) — the least-trusted segment on the network
# ============================================================================
# Rule 1: client isolation — guest devices can't see each other at all
block  proto any  from GUEST_net  to GUEST_net    # AP-level client isolation enforces this too (belt + suspenders)

# Rule 2: guest -> internet only, standard web/DNS ports, nothing else
pass   proto tcp  from GUEST_net  to !RFC1918     port {80,443}
pass   proto udp  from GUEST_net  to 1.1.1.1,1.0.0.1  port 53

# Rule 3: explicit deny, guest -> any RFC1918 (every internal VLAN) — the single most
# important rule on this interface, since it's what stops a compromised guest laptop
# from ever touching the corporate network, no matter what else is misconfigured above
block  log  proto any  from GUEST_net  to RFC1918

# Rule 4 (implicit): default deny — anything not matched above is dropped and logged
block  log  proto any  from GUEST_net  to any

# ============================================================================
# INTERFACE: WAREHOUSE (VLAN 20) — legacy/unpatched devices, most restricted internal segment
# ============================================================================
# Rule 5: warehouse devices -> the WMS/ERP integration server in Office VLAN, ONE host,
# ONE port (the app's API port) — not "Warehouse -> Office," a single pinhole
pass   proto tcp  from WAREHOUSE_net  to 10.10.10.20  port 8443

# Rule 6: warehouse devices -> internet, firmware/definition updates only, via explicit proxy
pass   proto tcp  from WAREHOUSE_net  to PROXY_HOST  port 3128

# Rule 7: explicit deny, warehouse -> Office (anything beyond the rule 5 pinhole),
# warehouse -> VoIP, warehouse -> Guest
block  log  proto any  from WAREHOUSE_net  to OFFICE_net
block  log  proto any  from WAREHOUSE_net  to VOIP_net
block  log  proto any  from WAREHOUSE_net  to GUEST_net

# Rule 8 (implicit): default deny
block  log  proto any  from WAREHOUSE_net  to any

# ============================================================================
# INTERFACE: OFFICE (VLAN 10)
# ============================================================================
# Rule 9: office -> the WMS server (same single host as rule 5, reverse direction —
# office staff query the WMS dashboard; they don't need to reach scanners/printers directly)
pass   proto tcp  from OFFICE_net  to 10.10.10.20  port {443,8443}

# Rule 10: office -> internet, standard business ports
pass   proto tcp  from OFFICE_net  to any  port {80,443,993,587}

# Rule 11: explicit deny, office -> Warehouse floor devices directly, office -> Guest
block  log  proto any  from OFFICE_net  to WAREHOUSE_net
block  log  proto any  from OFFICE_net  to GUEST_net

# ============================================================================
# INTERFACE: VOIP (VLAN 30)
# ============================================================================
# Rule 12: phones -> PBX/call-manager host (in Management) for provisioning + call signaling
pass   proto tcp  from VOIP_net  to 10.10.99.5  port {5060,5061,443}
pass   proto udp  from VOIP_net  to 10.10.99.5  port 5060

# Rule 13: phones -> SIP trunk provider (internet), RTP/SIP only
pass   proto udp  from VOIP_net  to SIP_TRUNK_PROVIDER  port 10000:20000
pass   proto tcp  from VOIP_net  to SIP_TRUNK_PROVIDER  port 5060

# Rule 14: explicit deny, VoIP -> Office data, VoIP -> Warehouse, VoIP -> Guest
block  log  proto any  from VOIP_net  to OFFICE_net
block  log  proto any  from VOIP_net  to WAREHOUSE_net
block  log  proto any  from VOIP_net  to GUEST_net

# ============================================================================
# INTERFACE: MANAGEMENT (VLAN 99) — network gear itself
# ============================================================================
# Rule 15: only the designated IT jump host (a single static IP in Office) may
# reach management interfaces, and only via SSH/HTTPS — nothing else, from nowhere else
pass   proto tcp  from 10.10.10.10  to MGMT_net  port {22,443}

# Rule 16: explicit deny — management is reachable from NOTHING else, including Office broadly
block  log  proto any  from OFFICE_net  to MGMT_net
block  log  proto any  from any  to MGMT_net

# ============================================================================
# GLOBAL DEFAULT (applies to any interface/path not explicitly matched above)
# ============================================================================
block  log  proto any  from any  to any

# ----------------------------------------------------------------------------
# Design note: every "pass" rule above names a specific host and/or port —
# there is no "pass any any" between VLANs anywhere in this policy. The one
# deliberate exception is Guest -> Internet (rule 2), which is the network's
# actual purpose for that segment, still scoped to web/DNS only.
