# Meridian Manufacturing — Riverside Branch — DHCP Server Config (simulated)
# ISC dhcpd-style syntax. One scope per VLAN; Guest gets a short lease time
# (visitor turnover) and Warehouse/VoIP get option scoping their respective
# devices actually need — nothing more.

authoritative;
default-lease-time 28800;   # 8 hours, default
max-lease-time 86400;

option domain-name "riverside.meridianmfg.local";
option domain-name-servers 10.10.10.5, 10.10.10.6;

# --- VLAN 10 / OFFICE ---------------------------------------------------
subnet 10.10.10.0 netmask 255.255.255.0 {
  range 10.10.10.50 10.10.10.230;
  option routers 10.10.10.1;
  option subnet-mask 255.255.255.0;
  default-lease-time 28800;
  max-lease-time 86400;
  # .2-.49 reserved for static assignments: file/print server, MFPs, static-IP workstations
}

# --- VLAN 20 / WAREHOUSE -------------------------------------------------
subnet 10.10.20.0 netmask 255.255.255.0 {
  range 10.10.20.50 10.10.20.220;
  option routers 10.10.20.1;
  option subnet-mask 255.255.255.0;
  default-lease-time 43200;   # 12h — floor devices rarely reboot, longer lease reduces DHCP chatter
  max-lease-time 86400;
  # .2-.49 reserved for the WMS kiosk server and the dock door controller (static)
}

# --- VLAN 30 / VOIP --------------------------------------------------------
subnet 10.10.30.0 netmask 255.255.255.0 {
  range 10.10.30.50 10.10.30.200;
  option routers 10.10.30.1;
  option subnet-mask 255.255.255.0;
  option tftp-server-name "10.10.30.5";     # phone provisioning server
  option bootfile-name "riverside-phone.cfg";
  default-lease-time 604800;   # 7 days — phones are effectively fixed once provisioned
  max-lease-time 1209600;
}

# --- VLAN 40 / GUEST ---------------------------------------------------
subnet 10.10.40.0 netmask 255.255.255.0 {
  range 10.10.40.50 10.10.40.240;
  option routers 10.10.40.1;
  option subnet-mask 255.255.255.0;
  option domain-name-servers 1.1.1.1, 1.0.0.1;   # public resolver only — never the internal DNS servers
  default-lease-time 3600;    # 1 hour — visitor turnover, keeps the pool from exhausting on a busy dock day
  max-lease-time 7200;
}

# --- VLAN 99 / MANAGEMENT -----------------------------------------------
# No DHCP scope defined on purpose — every management-interface IP (switches, APs,
# firewall, wireless controller) is statically assigned. A rogue device should never
# be able to just plug in and get a management-network address.
